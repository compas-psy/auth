# /etc/nginx/sites-available/auth.cmpas.ru
#
# Отдельный vhost сервиса идентичности. Ставится ровно тем же способом,
# каким уже поставлен moments.cmpas.ru: своя запись sites-available,
# свой symlink, свой сертификат от certbot. Конфигурацию cmpas.ru этот
# файл не читает и не меняет.
#
# Синтаксис — nginx: он обнаружен чтением соседнего репозитория
# (sites/moments.cmpas.ru/deploy/*.nginx.conf и SETUP.md), а не угадан.
#
# certbot --nginx (см. deploy/README.md) сам добавит listen 443, пути
# к сертификату и перенаправление с HTTP при первом выпуске.

server {
    listen 80;
    listen [::]:80;
    server_name auth.cmpas.ru;

    # HSTS. Сервис идентичности не имеет права открываться по HTTP:
    # cookie сессии помечена Secure, и без TLS вход просто не сложится.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Заголовки, снимающие целый класс ошибок чужой встройки.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Тело запроса у нас маленькое: почта, код, идентификатор. Мегабайты
    # сюда приходят только по ошибке или намеренно.
    client_max_body_size 64k;

    location / {
        # Порт обязан совпадать с опубликованным в docker-compose.yml.
        # Пока здесь стояло 3100, auth.cmpas.ru молча проксировал на
        # zapiski-api: чужой сервис на нашем домене.
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        # Без X-Forwarded-Proto сервис решит, что работает по http,
        # и откажется ставить Secure-cookie — вход перестанет
        # складываться, а причина будет неочевидной.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Проверка здоровья не должна попадать в журнал доступа: она идёт
    # раз в тридцать секунд и утопила бы всё остальное.
    location = /healthz {
        proxy_pass http://127.0.0.1:3200/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    access_log /var/log/nginx/auth.cmpas.ru.access.log;
    error_log  /var/log/nginx/auth.cmpas.ru.error.log;
}
