name: API

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  spec:
    name: Спецификация
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Стайл-гайд спецификации
        run: >-
          npx --yes @stoplight/spectral-cli lint
          server/openapi/simpasid.v1.yaml
          --ruleset server/openapi/.spectral.yaml
          --fail-severity error

      # oasdiff — программа на Go. В npm под этим именем лежит ЗАГЛУШКА
      # (версия 0.0.1-security, занятое имя без исполняемого файла),
      # поэтому npx --yes oasdiff падал с «could not determine
      # executable to run». Ставим настоящую, закреплённой версией.
      - uses: actions/setup-go@v5
        with: { go-version: "stable" }

      # Ломающее изменение видно ДО слияния, а не после (артборд R3).
      #
      # Шаг выполняется И на push в main. Раньше он стоял под
      # «if: pull_request», а вся работа шла прямым push — и за 25
      # зелёных прогонов проверка не отработала НИ РАЗУ. Зелёный статус
      # без проверки хуже отсутствия проверки: на него полагаются.
      - name: Ломающие изменения контракта
        run: |
          set -euo pipefail
          go install github.com/oasdiff/oasdiff@v1.31.0

          SPEC=server/openapi/simpasid.v1.yaml
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi

          if ! git show "$BASE:$SPEC" > /tmp/base.yaml 2>/dev/null; then
            echo "Спецификации в $BASE нет — сравнивать не с чем, это первое появление контракта."
            exit 0
          fi

          echo "Сравниваем $BASE и рабочее дерево."
          "$(go env GOPATH)/bin/oasdiff" breaking /tmp/base.yaml "$SPEC" --fail-on ERR
