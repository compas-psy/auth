name: Развернуть auth.cmpas.ru (nginx + TLS)

# РАЗОВОЕ (и повторяемое без вреда) обустройство сервера под сервис
# идентичности: свой vhost nginx и свой сертификат Let's Encrypt.
#
# Устроено ровно так же, как уже сделано для moments.cmpas.ru в
# репозитории cmpas.ru: тот способ обнаружен чтением, проверен на
# соседе и не выдуман здесь.
#
# ПОЧЕМУ ЭТО НЕ МОЖЕТ СЛОМАТЬ cmpas.ru:
#   * создаются ТОЛЬКО файлы сервиса: sites-available/auth.cmpas.ru
#     и symlink на него. Конфигурация cmpas.ru не читается и не правится;
#   * vhost включается, затем проверяется ВЕСЬ конфиг через nginx -t, и
#     перезагрузка идёт только если проверка прошла. Не прошла — symlink
#     снимается, и в sites-enabled остаётся только то, что проходит
#     nginx -t. Ни выкладка соседа, ни продление его сертификата не
#     унаследуют от нас сломанный файл;
#   * reload у nginx мягкий, соединения не рвутся. Это не restart;
#   * certbot вызывается с -d auth.cmpas.ru, то есть трогает только наш
#     блок. Сертификат cmpas.ru не затрагивается. Если certbot не
#     справился — сервис остаётся на HTTP, cmpas.ru не задет.

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/proxy/**"
      - ".github/workflows/provision.yml"
  workflow_dispatch:

concurrency:
  group: provision-auth
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    name: Установить vhost и выпустить сертификат
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Те же действия, какими сосед уже обустраивает moments.cmpas.ru
      # на этом сервере теми же секретами. Своё подключение через голый
      # ssh отказывало на publickey.
      - name: Передать конфигурацию прокси
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Ключ в секретах этого репозитория защищён парольной фразой —
          # без неё он не разбирается вовсе (ssh: this private key is
          # passphrase protected). Если секрета нет, значение пустое и
          # действие ведёт себя как раньше: ключу без фразы это не мешает.
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          source: deploy/proxy/auth.cmpas.ru.conf
          target: /tmp/simpasid-proxy
          strip_components: 2

      - name: Установить vhost и выпустить TLS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Ключ в секретах этого репозитория защищён парольной фразой —
          # без неё он не разбирается вовсе (ssh: this private key is
          # passphrase protected). Если секрета нет, значение пустое и
          # действие ведёт себя как раньше: ключу без фразы это не мешает.
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail

            # 1) Ставим только свой файл. Чужие не читаем и не трогаем.
            install -m 644 /tmp/simpasid-proxy/auth.cmpas.ru.conf \
              /etc/nginx/sites-available/auth.cmpas.ru

            # 2) Включаем и проверяем ВЕСЬ конфиг. Не прошло — откатываем
            #    включение, чтобы в sites-enabled осталось только рабочее.
            ln -sf /etc/nginx/sites-available/auth.cmpas.ru \
              /etc/nginx/sites-enabled/auth.cmpas.ru
            if nginx -t; then
              systemctl reload nginx
              echo "OK: vhost auth.cmpas.ru включён, nginx перезагружен. cmpas.ru не тронут."
            else
              rm -f /etc/nginx/sites-enabled/auth.cmpas.ru
              echo "ОШИБКА: nginx -t не прошёл. Включение откачено, nginx НЕ перезагружен, cmpas.ru без изменений." >&2
              exit 1
            fi

            # 3) TLS. Блок listen 443 в файл дописывает certbot, а шаг 1
            #    только что перезаписал файл нашей версией — значит при
            #    каждом повторном обустройстве TLS надо возвращать. Раньше
            #    здесь стояло условие «сертификата ещё нет», и повторный
            #    запуск тихо оставлял сервис идентичности на HTTP, где
            #    Secure-cookie не живёт и вход не складывается вовсе.
            CONF=/etc/nginx/sites-available/auth.cmpas.ru

            # ДИРЕКТИВА, а не любое упоминание. Проверка по подстроке
            # «listen 443» находила КОММЕНТАРИЙ в этом же файле («certbot
            # сам добавит listen 443») и всегда считала TLS настроенным:
            # certbot не вызывался ни разу, шаг отчитывался успехом за
            # три секунды, а сервис стоял без HTTPS. Комментарий
            # начинается с #, под этот образец не попадает.
            TLS_RE='^[[:space:]]*listen[[:space:]]+443'

            if ! grep -Eq "$TLS_RE" "$CONF"; then
              if [ -e /etc/letsencrypt/live/auth.cmpas.ru/fullchain.pem ]; then
                # Сертификат уже выпущен: только переустанавливаем его в
                # конфигурацию. Перевыпуска нет — счётчики Let's Encrypt
                # не тратятся, срок действия не сдвигается.
                certbot install --nginx --cert-name auth.cmpas.ru --redirect \
                  --non-interactive \
                  || echo "ВНИМАНИЕ: certbot install не справился." >&2
              else
                certbot --nginx -d auth.cmpas.ru --non-interactive --agree-tos \
                  -m admin@cmpas.ru --redirect \
                  || echo "ВНИМАНИЕ: выпуск сертификата не удался." >&2
              fi
            fi

            # 4) Итог — это ОТВЕТ сервиса, а не строка в файле. Файл
            #    показывает намерение; отвечает ли auth.cmpas.ru по
            #    HTTPS, знает только запрос.
            if grep -Eq "$TLS_RE" "$CONF" && nginx -t; then
              systemctl reload nginx
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              https://auth.cmpas.ru/healthz || echo 000)
            echo "https://auth.cmpas.ru/healthz -> $code"
            if [ "$code" = "200" ]; then
              echo "OK: auth.cmpas.ru отвечает по HTTPS. cmpas.ru не тронут."
            else
              echo "ОШИБКА: auth.cmpas.ru не отвечает по HTTPS ($code). Сервис идентичности" >&2
              echo "по HTTP бесполезен: cookie помечена Secure и не сохранится." >&2
              echo "cmpas.ru при этом не задет — его конфигурация не читалась." >&2
              exit 1
            fi
