name: Сборка и проверки

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Тесты и типы
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simpasid
          POSTGRES_PASSWORD: simpasid
          POSTGRES_DB: simpasid_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U simpasid -d simpasid_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://simpasid:simpasid@127.0.0.1:5433/simpasid_test
      ISSUER: https://auth.cmpas.ru
      KEYS_DIR: /tmp/simpasid-keys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Установка
        run: |
          npm ci --prefix server
          npm ci --prefix portal
          npm ci --prefix devsite
          npm ci --prefix packages/id-client

      - name: Типы
        run: |
          npm run typecheck --prefix server
          npm run typecheck --prefix portal
          npm run typecheck --prefix devsite
          npm run typecheck --prefix packages/id-client

      # Портал собирается ДО серверных тестов: они проверяют, что
      # собранный портал отдаётся по адресам из оболочки.
      - name: Сборка портала
        run: npm run build --prefix portal

      - name: Тесты сервера
        run: npm test --prefix server

      - name: Тесты портала
        run: npm test --prefix portal

      - name: Тесты ресурса разработчика
        run: npm test --prefix devsite

      - name: Тесты SDK и рецептов
        run: npm test --prefix packages/id-client

  client-kotlin:
    name: Котлин-клиент
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      # Обёртки (gradlew) в репозитории нет намеренно: она тянет за
      # собой двоичный gradle-wrapper.jar, который никто не читает и
      # никто не проверяет. Версия закреплена здесь и в отчёте видна.
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }

      - name: Тесты клиента
        working-directory: clients/android
        run: gradle test --console=plain

      # «BUILD SUCCESSFUL» само по себе не доказывает, что хоть одна
      # проверка выполнилась: пустой прогон выглядит точно так же.
      - name: Проверки и вправду выполнились
        working-directory: clients/android
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          total = bad = 0
          for path in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(path).getroot()
              total += int(r.get("tests"))
              bad += int(r.get("failures")) + int(r.get("errors"))
          print(f"проверок {total}, отказов {bad}")
          if total == 0 or bad:
              sys.exit("::error::прогон пуст или красный")
          EOF

  image:
    name: Образ собирается и поднимается
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Тот же Postgres, что и в тестах: образ обязан подняться на пустой
    # базе, сам применив миграции.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simpasid
          POSTGRES_PASSWORD: simpasid
          POSTGRES_DB: simpasid_smoke
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U simpasid -d simpasid_smoke"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t simpasid:ci --target runner .

      # Сборки МАЛО. Она не запускает приложение, и два дефекта уехали
      # на боевой сервер именно так: @fastify/middie лежал в
      # devDependencies, которых нет в образе (ERR_MODULE_NOT_FOUND), а
      # tsc не копировал .sql, и миграции в dist не доезжали (ENOENT
      # scandir /app/dist/db/migrations). Тесты этого не видели: они
      # идут от исходников, где установлено и лежит всё.
      - name: Контейнер поднимается на пустой базе
        run: |
          docker run -d --name simpasid-smoke --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://simpasid:simpasid@127.0.0.1:5433/simpasid_smoke \
            -e ISSUER=https://auth.cmpas.ru \
            -e PORT=3000 -e HOST=0.0.0.0 \
            simpasid:ci
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              echo "OK: контейнер отвечает на /healthz."; break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::Контейнер не поднялся за две минуты."
              docker logs simpasid-smoke; exit 1
            fi
            sleep 2
          done

      - name: Поверхность сервиса на месте
        run: |
          # Проверяется то, что человек и продукт открывают на самом
          # деле. …/dev собирался, ехал в образ — и не отдавался никем:
          # 404 на боевом адресе увидел бы разработчик продукта.
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              -H "Host: auth.cmpas.ru" -H "X-Forwarded-Proto: https" \
              "http://127.0.0.1:3000$1")
            echo "$1 -> $code (ожидалось $2)"
            [ "$code" = "$2" ] || fail=1
          }
          check /healthz 200
          check /.well-known/openid-configuration 200
          check /oidc/jwks 200
          check /account 200
          check /dev 302
          check /dev/ 200
          # Шрифт — часть экрана, а не украшение: без него кегль и ритм
          # макета рассыпаются. Собраться и уехать в образ мало, ровно
          # так уже случилось с /dev — оно собиралось и не отдавалось.
          check /assets/fonts/geist-cyrillic.woff2 200
          check /assets/fonts/geist-latin.woff2 200
          exit $fail

      # ЧЕЛОВЕК В БРАУЗЕРЕ. Всё остальное здесь и в тестах ходит либо
      # curl'ом, либо вызовом обработчика в том же процессе. За один
      # день ТРИ дефекта доехали до боевого сервера мимо зелёных
      # проверок, и каждый ловился только браузером: путь cookie,
      # заголовок Origin на POST и экран, не следующий адресу.
      #
      # Проверка предъявлена в обе стороны: с возвращённым умолчанием
      # oidc-provider она краснеет ровно той фразой, которую видел
      # учредитель, — «Вход временно недоступен».
      - name: Человек проходит вход в браузере
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

          # Отдельный контейнер: у него свой issuer — тот адрес, по
          # которому браузер и ходит. Метаданные на боевом домене
          # проверяет шаг выше, и подменять их там нельзя.
          docker run -d --name simpasid-browser --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://simpasid:simpasid@127.0.0.1:5433/simpasid_smoke \
            -e ISSUER=https://127.0.0.1:8443 \
            -e PORT=3001 -e HOST=0.0.0.0 \
            -e SMTP_HOST=127.0.0.1 -e SMTP_PORT=1025 -e SMTP_LOCAL_RELAY=true \
            simpasid:ci
          for i in $(seq 1 60); do
            curl -fsS --max-time 3 http://127.0.0.1:3001/healthz >/dev/null 2>&1 && break
            if [ "$i" = "60" ]; then
              echo "::error::Контейнер для браузерной проверки не поднялся."
              docker logs simpasid-browser; exit 1
            fi
            sleep 2
          done

          # Портал — такой же клиент OIDC, как продукты, и без записи в
          # реестре вход не начнётся.
          docker exec simpasid-browser node dist/cli/clients.js add \
            --id account-portal --name "Аккаунт СИМПАС" --product practice \
            --redirect https://127.0.0.1:8443/account/callback --public

          node .github/scripts/smoke-browser.mjs

      - name: Журнал контейнера браузерной проверки
        if: failure()
        run: docker logs simpasid-browser | tail -60

      - name: Адреса в метаданных абсолютны и на нашем домене
        run: |
          # Доверяющая сторона берёт jwks_uri ИЗ метаданных. Пока мост
          # на /.well-known переспрашивал провайдера без заголовков,
          # там стояло http://localhost при верном issuer.
          curl -s --max-time 5 -H "Host: auth.cmpas.ru" -H "X-Forwarded-Proto: https" \
            http://127.0.0.1:3000/.well-known/openid-configuration > meta.json
          issuer=$(jq -r .issuer meta.json)
          echo "issuer = $issuer"
          [ "$issuer" = "https://auth.cmpas.ru" ] || { echo "::error::issuer не тот"; exit 1; }
          bad=$(jq -r '
            to_entries[]
            | select((.key | test("_(endpoint|uri)$"))
                     and (.value | type == "string")
                     and ((.value | startswith("https://auth.cmpas.ru/")) | not))
            | "\(.key) = \(.value)"' meta.json)
          if [ -n "$bad" ]; then
            echo "::error::объявленные адреса не на нашем домене:"
            echo "$bad"
            exit 1
          fi
          echo "все объявленные адреса на https://auth.cmpas.ru"

      - name: Журнал контейнера
        if: always()
        run: docker logs simpasid-smoke || true

  deploy:
    name: Выкладка
    # В бой уезжает только то, что прошло И тесты, И сборку образа.
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
