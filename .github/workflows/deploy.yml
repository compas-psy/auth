name: Выкладка

# Вариант Б по Задаче 16, шаг 1. Основание выбора — чтение соседнего
# репозитория (docs/reports/E2/16-публикация.md): сервер СОБИРАЕТ образы
# из исходников по SSH и не умеет тянуть их из реестра. Ни одного
# упоминания ghcr.io или docker push в cmpas.ru нет.
#
# Способ доставки повторяет уже работающий у соседа и переиспользует
# те же три секрета.

on:
  # Выкладка идёт ТОЛЬКО после зелёных проверок, и связывает их не
  # событие workflow_run, а прямая зависимость needs в «Сборке и
  # проверках»: workflow_run срабатывает лишь тогда, когда файл лежит
  # в ветке по умолчанию, то есть молча отказал бы при любой другой
  # настройке репозитория.
  workflow_call:
  # Ручной запуск — на случай, когда надо выложить уже проверенное
  # (перевыкладка после правки на сервере, откат к прошлому коммиту).
  workflow_dispatch:

concurrency:
  group: deploy-auth
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Выложить на auth.cmpas.ru
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Подключение сделано тем же действием, каким уже выкладывается
      # cmpas.ru на этот же сервер теми же тремя секретами
      # (.github/workflows/deploy-docker.yml соседа). Своё подключение
      # через голый ssh отказывало на publickey: разбираться, чем именно
      # отличается его обработка ключа, дешевле не начинать — берём то,
      # что на этом сервере доказано работает.
      - name: Выложить
        uses: appleboy/ssh-action@v1.0.3
        env:
          SIMPASID_DB_PASSWORD: ${{ secrets.SIMPASID_DB_PASSWORD }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          # Выкладывается ровно тот коммит, который проверила сборка.
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Ключ в секретах этого репозитория защищён парольной фразой —
          # без неё он не разбирается вовсе (ssh: this private key is
          # passphrase protected). Если секрета нет, значение пустое и
          # действие ведёт себя как раньше: ключу без фразы это не мешает.
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          command_timeout: 30m
          envs: SIMPASID_DB_PASSWORD,DEPLOY_SHA,YANDEX_CLIENT_ID,YANDEX_CLIENT_SECRET
          script: |
            set -euo pipefail

            DIR=/var/www/auth.cmpas.ru
            # Свой каталог, рядом с /var/www/cmpas.ru и /var/www/zapiski,
            # но отдельный. Ни один файл соседа не читается и не пишется.
            if [ ! -d "$DIR/.git" ]; then
              mkdir -p "$DIR"
              git init -q "$DIR"
              git -C "$DIR" remote add origin https://github.com/compas-psy/auth
            fi
            cd "$DIR"
            git fetch --depth 1 origin "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            echo "Выкладывается коммит $DEPLOY_SHA"

            # Подготовка .env вынесена в файл репозитория: она
            # проверяется тестом server/test/deploy.env.test.ts, а
            # встроенная в рабочий процесс копия не проверяется ничем.
            # Скрипт СЧИТЫВАЕТСЯ, а не запускается: он убирает
            # подготовленные имена из окружения, а у docker compose
            # окружение оболочки старше .env, и пустое значение молча
            # перекрывает записанное в файле.
            . ./deploy/prepare-env.sh

            # Порт берётся из docker-compose.yml, а не задаётся здесь
            # ещё раз: два числа в двух файлах однажды разъедутся.
            PORT=$(sed -n 's/^ *- *"127\.0\.0\.1:\([0-9]\{1,\}\):[0-9]\{1,\}".*/\1/p' \
              docker-compose.yml | head -1)
            [ -n "$PORT" ] || { echo "ОШИБКА: не удалось прочитать порт из docker-compose.yml." >&2; exit 1; }

            # Занят ли порт кем-то, кроме нас. Прошлая выкладка встала
            # на 3100 с невнятным «port is already allocated» уже
            # посреди работы — а держал его zapiski-api, живые ЗАПИСКИ.
            # Освобождать чужой порт нельзя ни при каких условиях:
            # это и есть тот самый худший исход. Поэтому отказываемся
            # ДО запуска и называем виновника.
            if ss -ltnH "sport = :$PORT" 2>/dev/null | grep -q .; then
              if ! docker ps --filter "name=simpasid-app" --format '{{.Ports}}' \
                   | grep -q "127.0.0.1:$PORT->"; then
                echo "ОШИБКА: порт $PORT на петле занят не нами. Выкладка остановлена," >&2
                echo "чтобы не тронуть чужую службу. Кто держит порт:" >&2
                ss -ltnpH "sport = :$PORT" >&2 || true
                exit 1
              fi
            fi

            # Свой проект Compose: -p simpasid. Стек соседа не затрагивается.
            docker compose --project-name simpasid up -d --build

            # Ждём, пока проверка здоровья скажет, что сервис поднялся.
            for i in $(seq 1 60); do
              if curl -fsS --max-time 5 "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then
                echo "OK: сервис отвечает на /healthz."
                break
              fi
              if [ "$i" = "60" ]; then
                echo "ОШИБКА: сервис не поднялся за две минуты." >&2
                docker compose --project-name simpasid logs --tail 200 app >&2 || true
                exit 1
              fi
              sleep 2
            done

            docker image prune -f --filter "until=168h" >/dev/null 2>&1 || true

      # Задача 16, шаг 8. Успешная команда по ssh НЕ означает, что
      # сервис доступен: между ними стоят nginx, TLS и перенаправление.
      # Именно там auth.cmpas.ru какое-то время проксировал на чужой
      # сервис, пока все команды выполнялись успешно.
      - name: Проверить живой адрес
        run: |
          set -u
          fail=0
          note() { echo "$1"; }

          # 1) Метаданные по HTTPS и верный issuer.
          code=$(curl -s -o meta.json -w '%{http_code}' --max-time 20 \
            https://auth.cmpas.ru/.well-known/openid-configuration || echo 000)
          note "discovery -> $code"
          if [ "$code" = "200" ]; then
            issuer=$(jq -r .issuer meta.json)
            note "issuer = $issuer"
            [ "$issuer" = "https://auth.cmpas.ru" ] || { echo "::error::issuer не тот: $issuer"; fail=1; }
            bad=$(jq -r '
              to_entries[]
              | select((.key | test("_(endpoint|uri)$"))
                       and (.value | type == "string")
                       and ((.value | startswith("https://auth.cmpas.ru/")) | not))
              | "\(.key) = \(.value)"' meta.json)
            [ -z "$bad" ] || { echo "::error::адреса не на нашем домене: $bad"; fail=1; }
          else
            echo "::error::метаданные недоступны по HTTPS"; fail=1
          fi

          # 2) HSTS: сервис идентичности не имеет права открываться по HTTP.
          if curl -sI --max-time 20 https://auth.cmpas.ru/healthz \
             | grep -qi "Strict-Transport-Security"; then
            note "HSTS: есть"
          else
            echo "::error::заголовка Strict-Transport-Security нет"; fail=1
          fi

          # 3) Приход по HTTP уводится на HTTPS, а не обслуживается.
          redir=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://auth.cmpas.ru/ || echo 000)
          note "http:// -> $redir"
          case "$redir" in 30*) ;; *) echo "::error::HTTP не перенаправляется на HTTPS ($redir)"; fail=1;; esac

          # 4) Поверхность сервиса на живом адресе.
          for pair in "/healthz 200" "/oidc/jwks 200" "/account 200" "/dev/ 200"; do
            path=${pair% *}; want=${pair#* }
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://auth.cmpas.ru$path" || echo 000)
            note "$path -> $got (ожидалось $want)"
            [ "$got" = "$want" ] || fail=1
          done

          # 5) Первичный токен-API закрыт для чужих.
          # /v1/auth/* доступен ТОЛЬКО клиентам с first_party = true
          # (12_NATIVE_AUTH.md §3.1): вход, спроектированный в расчёте
          # на доверенное приложение, не должен быть открыт всем.
          # Анонимный запрос обязан получить 403 forbidden_client —
          # это и проверяется. Состав способов входа отсюда не виден,
          # и это не пробел проверки, а работающая защита.
          gate=$(curl -s -o gate.json -w '%{http_code}' --max-time 20 \
            https://auth.cmpas.ru/v1/auth/methods || echo 000)
          note "/v1/auth/methods без клиента -> $gate $(cat gate.json 2>/dev/null)"
          if [ "$gate" = "403" ] && grep -q forbidden_client gate.json; then
            note "первичный токен-API закрыт, как и требуется"
          else
            echo "::error::первичный токен-API отвечает чужому клиенту ($gate)"
            fail=1
          fi

          exit $fail

      - name: Проверить, что сосед жив
        run: |
          # Публикация сервиса не имеет права задеть cmpas.ru. Проверка
          # снаружи, а не по логам: она и есть доказательство.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://cmpas.ru/ || echo 000)
          echo "cmpas.ru -> $code"
          case "$code" in 2*|3*) ;; *) echo "::error::cmpas.ru отвечает $code после выкладки"; exit 1;; esac
