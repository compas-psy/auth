name: Осмотр сервера

# ТОЛЬКО ЧТЕНИЕ. Ни одной команды, меняющей состояние сервера: ни
# docker, ни systemctl, ни правки файлов. Нужен, когда выкладка
# упирается в занятый ресурс и решение надо принимать по факту, а не
# по догадке — как случилось с портом 3100
# («Bind for 127.0.0.1:3100 failed: port is already allocated»).
#
# Запускается вручную и никогда сам.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ports:
    name: Какие порты петли заняты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Снять карту слушателей
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          command_timeout: 5m
          script: |
            set -eu
            echo "== слушатели TCP =="
            # Только адрес, порт и имя процесса. Полная командная
            # строка не печатается: в её аргументах у соседа могут
            # оказаться значения, которым не место в журнале прогона.
            ss -ltnH | awk '{print $4}' | sort -u
            echo
            echo "== кто держит порты 3000-3999 =="
            ss -ltnpH 2>/dev/null \
              | awk '$4 ~ /:(3[0-9][0-9][0-9])$/ {print $4, $NF}' \
              | sed 's/pid=[0-9]*,//; s/fd=[0-9]*//' \
              | sort -u
            echo
            echo "== контейнеры =="
            docker ps --format '{{.Names}}\t{{.Ports}}'
            echo
            echo "== включённые vhost =="
            ls -l /etc/nginx/sites-enabled/
            echo
            echo "== наш блок в действующей конфигурации =="
            # nginx -T печатает то, с чем nginx РАБОТАЕТ, а не то, что
            # лежит в файле: после certbot это не одно и то же.
            nginx -T 2>/dev/null \
              | grep -nE "server_name auth|listen |ssl_certificate|proxy_pass|return 301" \
              | grep -A6 -B6 "auth.cmpas.ru" || echo "блок auth.cmpas.ru в действующей конфигурации не найден"
            echo
            echo "== что в файле vhost =="
            grep -nE "listen|server_name|ssl_certificate|proxy_pass|return" \
              /etc/nginx/sites-available/auth.cmpas.ru || true
            echo
            echo "== сертификаты =="
            certbot certificates 2>/dev/null | grep -A4 "auth.cmpas.ru" || echo "сертификата auth.cmpas.ru нет"
            echo
            echo "== какие ключи заведены (ИМЕНА, без значений) =="
            # Имя ключа отвечает на вопрос «дошёл ли он до сервера» и
            # секретом не является. Значение — является, и в журнал
            # прогона не попадает ни при каких условиях.
            cut -d= -f1 /var/www/auth.cmpas.ru/.env 2>/dev/null | sort \
              || echo ".env не прочитан"

            echo
            echo "== отказы сервиса за 6 часов =="
            # Род отказа, а не его содержание: имя класса ошибки и код
            # Postgres. Текста сообщения в журнале нет по построению —
            # там ехали бы адреса и пути.
            fails=$(docker logs --since 6h simpasid-app 2>&1 \
              | grep -o '"event":"request_failed"[^}]*' \
              | grep -o '"status":[0-9]*\|"kind":"[^"]*"' \
              | paste - - 2>/dev/null | sort | uniq -c)
            if [ -z "$fails" ]; then
              echo "ОТКАЗОВ ЗА 6 ЧАСОВ НЕ БЫЛО"
            else
              echo "$fails"
            fi

            echo
            echo "== состояние схемы =="
            # Раньше применённость миграции ВЫВОДИЛАСЬ из устройства
            # запуска: listen происходит только после runMigrations,
            # значит отвечающий сервис миграции применил. Вывод верный,
            # но обязательство перед ПРАКТИКОЙ (sub не меняется) лучше
            # видеть, чем выводить. Команда только спрашивает.
            # «|| true» обязателен: при set -e неудачная подстановка
            # роняет ВЕСЬ осмотр. Именно так и вышло в первый же
            # запуск — команды на сервере ещё не было, и осмотр
            # оборвался до клиентов, почты и ответа сервера. Осмотр не
            # имеет права замолчать из-за одного своего шага.
            schema=$(docker exec simpasid-app node dist/cli/schema.js 2>&1 || true)
            if [ -z "$schema" ]; then
              echo "СХЕМА НЕ ОПРОШЕНА — приложение не ответило"
            else
              echo "$schema"
            fi

            echo
            echo "== юридические документы: что видит база =="
            # Отпечаток редакции — доказательство того, что человек
            # принял ИМЕННО этот текст. Проба входа сверяет байты,
            # отданные наружу, с описью поставки; здесь печатается
            # другая сторона той же связки — что стоит в реестре.
            # Расхождение между этими двумя местами и есть подмена.
            #
            # PENDING — не поломка: у документа просто нет текста.
            # Так честно живут «Согласие клиента психолога» (текст не
            # написан) и Особые условия ШАГОВ (документа не существует).
            docker exec simpasid-postgres psql -U simpasid -d simpasid -At \
              -c "SELECT v.code || ' ' || v.version || ' -> ' ||
                         CASE WHEN v.content_hash = 'PENDING'
                              THEN 'текста нет' ELSE v.content_hash END
                  FROM legal_document_versions v ORDER BY v.code, v.version" \
              2>&1 || echo "реестр документов не прочитан"

            echo
            echo "== зарегистрированные клиенты =="
            # Перечень ключей НЕ печатает: список смотрят чаще, чем
            # заводят клиента, и попадёт он не только тому, кто клиента
            # выпускал.
            clients=$(docker exec simpasid-app node dist/cli/clients.js list 2>&1 || true)
            if [ -z "$clients" ]; then
              echo "КЛИЕНТОВ НЕТ — войти не сможет ни один продукт"
            else
              echo "$clients"
            fi

            echo
            echo "== экран входа каждого клиента открывается =="
            # «Клиент есть в реестре» и «клиент работает» — разные вещи.
            # Портал аккаунта был в реестре и отвечал живому человеку
            # invalid_client, потому что работающий процесс прочитал
            # перечень клиентов при старте и о нём не знал. Список это
            # не показывал никак. Поэтому спрашиваем сам сервис.
            #
            # Каждая проверка заводит запись взаимодействия, которая
            # протухает сама, — это цена честного ответа.
            #
            # Клиенты без адреса возврата пропускаются: это первичные,
            # они в браузер не ходят вовсе (12_NATIVE_AUTH.md).
            printf '%s\n' "$clients" | while IFS="$(printf '\t')" read -r id product kind uris; do
              [ -n "$id" ] || continue
              first=$(printf '%s' "$uris" | cut -d" " -f1)
              if [ -z "$first" ] || [ "$first" = "—" ]; then
                echo "$id: адреса возврата нет — первичный клиент, экран входа ему не нужен"
                continue
              fi
              # Ответ забирается В ПЕРЕМЕННУЮ, без временного файла:
              # осмотр не оставляет на сервере ни одного следа и не
              # выполняет ни одной команды, что-либо меняющей.
              out=$(curl -s -w '\n%{http_code}' --max-time 10 -G \
                https://auth.cmpas.ru/oidc/auth \
                --data-urlencode "client_id=$id" \
                --data-urlencode "redirect_uri=$first" \
                --data "response_type=code&scope=openid+email&state=osmotr&nonce=osmotr&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256" \
                || printf '\n000')
              code=$(printf '%s' "$out" | tail -1)
              case "$code" in
                303|302) echo "$id: экран входа открывается ($code)" ;;
                *)       echo "$id: ЭКРАН ВХОДА НЕ ОТКРЫВАЕТСЯ ($code) — $(printf '%s' "$out" | head -c 200)" ;;
              esac
            done

            echo
            echo "== чем клиент предъявляет себя на обмене кода =="
            # Экран входа открывается и код выдаётся ДАЖЕ у клиента,
            # заведённого с ключом: на авторизации клиент себя не
            # предъявляет. Проверка подлинности происходит только на
            # обмене кода. Поэтому «экран открылся» ничего не говорит о
            # том, дойдёт ли человек до конца.
            docker exec simpasid-postgres psql -U simpasid -d simpasid -At \
              -c "SELECT client_id || ' -> ' || auth_method ||
                         CASE WHEN client_secret IS NULL
                              THEN ' (без ключа)' ELSE ' (с ключом)' END
                  FROM oidc_clients WHERE disabled_at IS NULL ORDER BY client_id" \
              2>&1 || echo "реестр не прочитан"

            echo
            echo "== что отвечает сам обмен кода =="
            # Заведомо негодный код. Ответ различает две вещи, которые
            # снаружи выглядят одинаково — «вход недоступен»:
            #   invalid_grant  — клиент принят, не годится код (так и надо);
            #   invalid_client — клиент НЕ принят без ключа, и портал,
            #                    который ключа не имеет, не войдёт никогда.
            # Origin ОБЯЗАТЕЛЕН В ПРОБЕ. Браузер шлёт его на каждый POST,
            # включая запрос на собственный домен, а умолчание библиотеки
            # такие запросы отвергало — портал не мог войти НИ РАЗУ.
            # Проба без Origin отвечала бодрым invalid_grant и ничего не
            # замечала: ровно так я и не заметил.
            curl -sS --max-time 10 -X POST https://auth.cmpas.ru/oidc/token \
              -H 'content-type: application/x-www-form-urlencoded' \
              -H 'origin: https://auth.cmpas.ru' \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "code=osmotr-negodnyi-kod" \
              --data-urlencode "redirect_uri=https://auth.cmpas.ru/account/callback" \
              --data-urlencode "client_id=account-portal" \
              --data-urlencode "code_verifier=osmotr-proverochnyi-kod-dlinoyu-sorok-tri-znaka" \
              | head -c 300
            echo

            echo
            echo "== какие способы входа видит человек =="
            # «Ключ лежит в .env» и «кнопка есть на экране» — разные
            # вещи. Между ними: провайдер должен подключиться при старте,
            # попасть в состав экрана и дойти до браузера. Пропуск любого
            # звена даёт не отказ, а ТИШИНУ — кнопки просто нет.
            #
            # Поэтому спрашиваем сам экран. Cookie собираются из
            # заголовков в переменную: осмотр не оставляет на сервере ни
            # одного файла и ничего не меняет.
            head=$(curl -sS -D - -o /dev/null --max-time 10 -G \
              https://auth.cmpas.ru/oidc/auth \
              --data-urlencode "client_id=account-portal" \
              --data-urlencode "redirect_uri=https://auth.cmpas.ru/account/callback" \
              --data "response_type=code&scope=openid+email&state=osmotr&nonce=osmotr&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256" \
              || printf '')
            where=$(printf '%s' "$head" | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r')
            jar=$(printf '%s' "$head" | awk 'tolower($1)=="set-cookie:"{print $2}' \
              | tr -d '\r' | paste -sd';' -)
            if [ -z "$where" ]; then
              echo "ЭКРАН ВХОДА НЕ ОТКРЫЛСЯ — состав способов не спросить"
            else
              screen=$(curl -sS --max-time 10 -H "Cookie: $jar" \
                "https://auth.cmpas.ru$where" || printf '')
              ways=$(printf '%s' "$screen" | grep -o '"providers":\[[^]]*\]' | head -1)
              case "$ways" in
                '"providers":[]')
                  echo "НИ ОДНОГО ПРОВАЙДЕРА: на экране только вход по почте" ;;
                "") echo "СОСТАВ СПОСОБОВ НЕ ПРОЧИТАН — экран отдал не то, что ожидалось" ;;
                *)  echo "$ways" ;;
              esac
            fi

            echo
            echo "== почта: что сделали МЫ =="
            # Наши события писем адресов не содержат по построению (У-9):
            # в них только вид письма и исход.
            # Пустой вывод — не ответ: его легко принять за «всё в
            # порядке». Пишем словами, что попыток не было.
            ours=$(docker logs --since 6h simpasid-app 2>&1 \
              | grep -o '"event":"mail_[a-z_]*"' | sort | uniq -c)
            if [ -z "$ours" ]; then
              echo "ПОПЫТОК ОТПРАВКИ ЗА 6 ЧАСОВ НЕ БЫЛО (вход по почте никто не запрашивал)"
            else
              echo "$ours"
            fi

            echo
            echo "== почта: что сделал релей =="
            # ТОЛЬКО исходы доставки, без единого адреса. Журнал релея
            # общий с соседом, и чужие адреса в журнал прогона попадать
            # не должны — как и свои.
            relay=$(docker logs --since 6h cmpas-mailer 2>&1 \
              | grep -o 'status=[a-z]*' | sort | uniq -c)
            if [ -z "$relay" ]; then
              echo "РЕЛЕЙ ЗА 6 ЧАСОВ НЕ ОТПРАВИЛ НИ ОДНОГО ПИСЬМА"
            else
              echo "$relay"
              echo "(исходы по всему релею: и наши письма, и соседские)"
            fi

            echo
            echo "== почта: очередь =="
            docker exec cmpas-mailer postqueue -p 2>&1 | tail -3 \
              || echo "очередь не прочитана"

            echo
            echo "== что отвечает сам сервер =="
            curl -sI --max-time 10 https://auth.cmpas.ru/healthz | head -3 || echo "HTTPS с самого сервера не отвечает"
            curl -s -o /dev/null -w 'локально 3200 -> %{http_code}\n' --max-time 5 http://127.0.0.1:3200/healthz || true

            echo
            echo "== SSH: пределы одновременных подключений =="
            # Д-3: рукопожатие рвётся до единой команды, непостоянно.
            # Первый подозреваемый — MaxStartups: sshd начинает СБРАСЫВАТЬ
            # ещё не прошедшие проверку подключения, когда их больше
            # порога. Со стороны клиента это выглядит ровно так, как
            # выглядело у нас: reset за доли секунды, без причины.
            #
            # `sshd -T` печатает то, с чем sshd РАБОТАЕТ, а не то, что
            # лежит в файле, — как nginx -T выше. Файл читается только
            # если действующую конфигурацию не выдали.
            sshd -T 2>/dev/null \
              | grep -E '^(maxstartups|maxsessions|logingracetime|persource)' \
              || grep -hiE '^[[:space:]]*(MaxStartups|MaxSessions|LoginGraceTime|PerSource)' \
                   /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null \
              || echo "настройки sshd не прочитаны (скорее всего не хватает прав)"

            echo
            echo "== SSH: за сутки отказов, по причинам =="
            # Только причины и счётчики. Ни одного адреса: в журнале
            # sshd их полно, и это чужие адреса, а не наши.
            #
            # «drop connection #N» — это и есть след MaxStartups. Если
            # он тут появится, догадка перестанет быть догадкой.
            reasons=$(journalctl -u ssh -u sshd --since '24 hours ago' --no-pager 2>/dev/null \
              | grep -oE 'drop connection #[0-9]+|Timeout before authentication|maximum authentication attempts|Connection closed by authenticating user|Connection reset by|banner exchange' \
              | sed -E 's/#[0-9]+/#N/' | sort | uniq -c)
            if [ -z "$reasons" ]; then
              echo "журнал sshd за сутки пуст или недоступен (нужны права root или группа adm)"
            else
              echo "$reasons"
            fi

            echo
            echo "== fail2ban: считает ли он наши прогоны подозрительными =="
            # Второй подозреваемый. Выкладка и осмотр приходят с адресов
            # раннеров GitHub — каждый раз с нового, и каждый раз это
            # новое подключение по ключу. Список забаненных не
            # печатается: там чужие адреса.
            if command -v fail2ban-client >/dev/null 2>&1; then
              fail2ban-client status 2>/dev/null | grep -i 'jail list' \
                || echo "fail2ban установлен, но не отвечает (нужны права root)"
              fail2ban-client status sshd 2>/dev/null \
                | grep -E 'Currently failed|Total failed|Currently banned|Total banned' \
                || echo "тюрьмы sshd нет или она не прочитана"
            else
              echo "fail2ban на сервере не установлен — эта версия отпадает"
            fi

            echo
            echo "== вход через провайдеров: что подключилось при запуске =="
            # Отвечает на вопрос «почему на экране нет кнопки» и на
            # обратный «почему кнопка есть, а VK её не узнаёт». Имена
            # провайдеров человек и так видит на экране входа.
            connected=$(docker logs simpasid-app 2>&1 \
              | grep -o '"event":"providers_connected"[^}]*' | tail -1)
            if [ -z "$connected" ]; then
              echo "запись о подключении провайдеров не найдена (образ старее этой проверки)"
            else
              echo "$connected"
            fi
            # Негодный ключ провайдера. Значение ключа в этой записи не
            # печатается по построению — только вид отказа и длина.
            refused=$(docker logs simpasid-app 2>&1 \
              | grep -o '"event":"provider_not_connected"[^}]*' | sort -u)
            if [ -n "$refused" ]; then
              echo "ОТКАЗ ПОДКЛЮЧЕНИЯ:"
              echo "$refused"
            fi
