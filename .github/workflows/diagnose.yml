name: Осмотр сервера

# ТОЛЬКО ЧТЕНИЕ. Ни одной команды, меняющей состояние сервера: ни
# docker, ни systemctl, ни правки файлов. Нужен, когда выкладка
# упирается в занятый ресурс и решение надо принимать по факту, а не
# по догадке — как случилось с портом 3100
# («Bind for 127.0.0.1:3100 failed: port is already allocated»).
#
# Запускается вручную и никогда сам.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ports:
    name: Какие порты петли заняты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Снять карту слушателей
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          command_timeout: 5m
          script: |
            set -eu
            echo "== слушатели TCP =="
            # Только адрес, порт и имя процесса. Полная командная
            # строка не печатается: в её аргументах у соседа могут
            # оказаться значения, которым не место в журнале прогона.
            ss -ltnH | awk '{print $4}' | sort -u
            echo
            echo "== кто держит порты 3000-3999 =="
            ss -ltnpH 2>/dev/null \
              | awk '$4 ~ /:(3[0-9][0-9][0-9])$/ {print $4, $NF}' \
              | sed 's/pid=[0-9]*,//; s/fd=[0-9]*//' \
              | sort -u
            echo
            echo "== контейнеры =="
            docker ps --format '{{.Names}}\t{{.Ports}}'
            echo
            echo "== включённые vhost =="
            ls -l /etc/nginx/sites-enabled/
            echo
            echo "== наш блок в действующей конфигурации =="
            # nginx -T печатает то, с чем nginx РАБОТАЕТ, а не то, что
            # лежит в файле: после certbot это не одно и то же.
            nginx -T 2>/dev/null \
              | grep -nE "server_name auth|listen |ssl_certificate|proxy_pass|return 301" \
              | grep -A6 -B6 "auth.cmpas.ru" || echo "блок auth.cmpas.ru в действующей конфигурации не найден"
            echo
            echo "== что в файле vhost =="
            grep -nE "listen|server_name|ssl_certificate|proxy_pass|return" \
              /etc/nginx/sites-available/auth.cmpas.ru || true
            echo
            echo "== сертификаты =="
            certbot certificates 2>/dev/null | grep -A4 "auth.cmpas.ru" || echo "сертификата auth.cmpas.ru нет"
            echo
            echo "== какие ключи заведены (ИМЕНА, без значений) =="
            # Имя ключа отвечает на вопрос «дошёл ли он до сервера» и
            # секретом не является. Значение — является, и в журнал
            # прогона не попадает ни при каких условиях.
            cut -d= -f1 /var/www/auth.cmpas.ru/.env 2>/dev/null | sort \
              || echo ".env не прочитан"

            echo
            echo "== отказы сервиса за 6 часов =="
            # Род отказа, а не его содержание: имя класса ошибки и код
            # Postgres. Текста сообщения в журнале нет по построению —
            # там ехали бы адреса и пути.
            fails=$(docker logs --since 6h simpasid-app 2>&1 \
              | grep -o '"event":"request_failed"[^}]*' \
              | grep -o '"status":[0-9]*\|"kind":"[^"]*"' \
              | paste - - 2>/dev/null | sort | uniq -c)
            if [ -z "$fails" ]; then
              echo "ОТКАЗОВ ЗА 6 ЧАСОВ НЕ БЫЛО"
            else
              echo "$fails"
            fi

            echo
            echo "== состояние схемы =="
            # Раньше применённость миграции ВЫВОДИЛАСЬ из устройства
            # запуска: listen происходит только после runMigrations,
            # значит отвечающий сервис миграции применил. Вывод верный,
            # но обязательство перед ПРАКТИКОЙ (sub не меняется) лучше
            # видеть, чем выводить. Команда только спрашивает.
            # «|| true» обязателен: при set -e неудачная подстановка
            # роняет ВЕСЬ осмотр. Именно так и вышло в первый же
            # запуск — команды на сервере ещё не было, и осмотр
            # оборвался до клиентов, почты и ответа сервера. Осмотр не
            # имеет права замолчать из-за одного своего шага.
            schema=$(docker exec simpasid-app node dist/cli/schema.js 2>&1 || true)
            if [ -z "$schema" ]; then
              echo "СХЕМА НЕ ОПРОШЕНА — приложение не ответило"
            else
              echo "$schema"
            fi

            echo
            echo "== зарегистрированные клиенты =="
            # Перечень ключей НЕ печатает: список смотрят чаще, чем
            # заводят клиента, и попадёт он не только тому, кто клиента
            # выпускал.
            clients=$(docker exec simpasid-app node dist/cli/clients.js list 2>&1 || true)
            if [ -z "$clients" ]; then
              echo "КЛИЕНТОВ НЕТ — войти не сможет ни один продукт"
            else
              echo "$clients"
            fi

            echo
            echo "== экран входа каждого клиента открывается =="
            # «Клиент есть в реестре» и «клиент работает» — разные вещи.
            # Портал аккаунта был в реестре и отвечал живому человеку
            # invalid_client, потому что работающий процесс прочитал
            # перечень клиентов при старте и о нём не знал. Список это
            # не показывал никак. Поэтому спрашиваем сам сервис.
            #
            # Каждая проверка заводит запись взаимодействия, которая
            # протухает сама, — это цена честного ответа.
            #
            # Клиенты без адреса возврата пропускаются: это первичные,
            # они в браузер не ходят вовсе (12_NATIVE_AUTH.md).
            printf '%s\n' "$clients" | while IFS="$(printf '\t')" read -r id product kind uris; do
              [ -n "$id" ] || continue
              first=$(printf '%s' "$uris" | cut -d" " -f1)
              if [ -z "$first" ] || [ "$first" = "—" ]; then
                echo "$id: адреса возврата нет — первичный клиент, экран входа ему не нужен"
                continue
              fi
              body=$(mktemp)
              code=$(curl -s -o "$body" -w '%{http_code}' --max-time 10 -G \
                https://auth.cmpas.ru/oidc/auth \
                --data-urlencode "client_id=$id" \
                --data-urlencode "redirect_uri=$first" \
                --data "response_type=code&scope=openid+email&state=osmotr&nonce=osmotr&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256" \
                || echo "000")
              case "$code" in
                303|302) echo "$id: экран входа открывается ($code)" ;;
                *)       echo "$id: ЭКРАН ВХОДА НЕ ОТКРЫВАЕТСЯ ($code) — $(head -c 200 "$body")" ;;
              esac
              rm -f "$body"
            done

            echo
            echo "== почта: что сделали МЫ =="
            # Наши события писем адресов не содержат по построению (У-9):
            # в них только вид письма и исход.
            # Пустой вывод — не ответ: его легко принять за «всё в
            # порядке». Пишем словами, что попыток не было.
            ours=$(docker logs --since 6h simpasid-app 2>&1 \
              | grep -o '"event":"mail_[a-z_]*"' | sort | uniq -c)
            if [ -z "$ours" ]; then
              echo "ПОПЫТОК ОТПРАВКИ ЗА 6 ЧАСОВ НЕ БЫЛО (вход по почте никто не запрашивал)"
            else
              echo "$ours"
            fi

            echo
            echo "== почта: что сделал релей =="
            # ТОЛЬКО исходы доставки, без единого адреса. Журнал релея
            # общий с соседом, и чужие адреса в журнал прогона попадать
            # не должны — как и свои.
            relay=$(docker logs --since 6h cmpas-mailer 2>&1 \
              | grep -o 'status=[a-z]*' | sort | uniq -c)
            if [ -z "$relay" ]; then
              echo "РЕЛЕЙ ЗА 6 ЧАСОВ НЕ ОТПРАВИЛ НИ ОДНОГО ПИСЬМА"
            else
              echo "$relay"
              echo "(исходы по всему релею: и наши письма, и соседские)"
            fi

            echo
            echo "== почта: очередь =="
            docker exec cmpas-mailer postqueue -p 2>&1 | tail -3 \
              || echo "очередь не прочитана"

            echo
            echo "== что отвечает сам сервер =="
            curl -sI --max-time 10 https://auth.cmpas.ru/healthz | head -3 || echo "HTTPS с самого сервера не отвечает"
            curl -s -o /dev/null -w 'локально 3200 -> %{http_code}\n' --max-time 5 http://127.0.0.1:3200/healthz || true
